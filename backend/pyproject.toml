[project]
name = "legallens-backend"
version = "0.1.0"
description = "Legal Lens backend — FastAPI. Grounded reading and drafting over an attorney's own documents."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.118",
    "uvicorn[standard]>=0.37",
    "pydantic>=2.11",
    "pydantic-settings>=2.11",
    "sqlalchemy[asyncio]>=2.0.43",
    "aiosqlite>=0.21",
    "alembic>=1.16",
    "argon2-cffi>=25.1",
    "cryptography>=46.0",
    "python-multipart>=0.0.20",
    "pypdf>=6.1",
    "python-docx>=1.2",
    "itsdangerous>=2.2",
    "email-validator>=2.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.4",
    "pytest-asyncio>=1.2",
    "httpx>=0.28",
    "ruff>=0.14",
    "mypy>=1.18",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "S", "C4", "RET", "SIM"]
ignore = ["S101", "B008", "RET504"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "E501"]
"app/ai/fixtures/*" = ["E501"]
"migrations/*" = ["E501", "I001"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
warn_return_any = false
disallow_untyped_decorators = false

[[tool.mypy.overrides]]
module = ["pypdf.*", "docx.*", "argon2.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
